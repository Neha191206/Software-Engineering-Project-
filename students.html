<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Students - College Attendance Management System</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content" id="content">
      <div id="msg" class="alert" role="status" hidden></div>
      <section class="panel" id="addPanel" hidden>
        <div class="panel-head"><h2>Add student</h2></div>
        <form id="studentForm" novalidate>
          <div class="form-grid">
            <div class="field"><label for="fRoll">Roll number</label><input id="fRoll" placeholder="e.g. CS106"><span class="err" id="fRollErr"></span></div>
            <div class="field"><label for="fName">Student name</label><input id="fName"><span class="err" id="fNameErr"></span></div>
            <div class="field"><label for="fClass">Class</label><select id="fClass"></select><span class="err" id="fClassErr"></span></div>
            <div class="field"><label for="fDept">Department</label><input id="fDept"><span class="err" id="fDeptErr"></span></div>
            <div class="field"><label for="fEmail">Email</label><input id="fEmail" type="email"><span class="err" id="fEmailErr"></span></div>
          </div>
          <div class="btn-row"><button class="btn" type="submit">Save student</button><button class="btn secondary" type="button" id="cancelAdd">Cancel</button></div>
        </form>
      </section>
      <section class="panel">
        <div class="panel-head">
          <h2>Student list</h2>
          <input id="search" type="search" placeholder="Search by name or roll number" aria-label="Search students" style="max-width:280px">
          <button class="btn" id="addBtn" type="button">Add Student</button>
        </div>
        <div class="table-wrap"><table>
          <thead><tr><th>Roll Number</th><th>Student Name</th><th>Class</th><th>Department</th><th>Email</th><th>Action</th></tr></thead>
          <tbody id="rows"></tbody>
        </table></div>
        <p class="summary-line" id="count"></p>
      </section>
      <dialog id="detail"><h2>Student details</h2><div id="detailBody"></div><div class="btn-row"><button class="btn" id="closeDetail" type="button">Close</button></div></dialog>
    </main>
  </div>
</div>
<div class="overlay" id="overlay"></div>
<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/students.js"></script>
</body>
</html>
